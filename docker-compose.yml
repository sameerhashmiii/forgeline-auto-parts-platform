services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auto_parts_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - forgeline_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auto_parts_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  forgeline_postgres:
